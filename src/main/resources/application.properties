# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=secure-checkout-service
server.port=8080

# ── Database (override in prod via env vars) ──────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checkout_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ── OpenAPI ───────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Webhook ───────────────────────────────────────────────────────────────────
webhook.retry.max-attempts=3
webhook.retry.backoff-ms=2000

# ── Resilience4j ─────────────────────────────────────────────────────────────
resilience4j.circuitbreaker.instances.payment-gateway.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment-gateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment-gateway.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.payment-gateway.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.payment-gateway.max-attempts=3
resilience4j.retry.instances.payment-gateway.wait-duration=500ms
resilience4j.retry.instances.payment-gateway.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException

# ── Logging ───────────────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.level.com.checkout=DEBUG
